# In-container nginx for the frontend. Serves the SPA and reverse-proxies
# /api/ (REST + SSE) and /uploads media to the backend service.
#
# TLS is terminated upstream by the nginx-proxy + acme-companion pair, so
# this server only listens on port 80.

server {
    listen 80;
    server_name _;

    client_max_body_size 4096m;

    # Static SPA — HTML5 history routing falls back to index.html.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived static assets get aggressive caching; index.html stays fresh.
    location ~* \.(js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # API + SSE. Critical: disable buffering and bump timeouts so the
    # /api/events stream and large multipart uploads survive.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
}
